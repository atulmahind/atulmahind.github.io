---
layout: default
title: Blog | Atul Mahind
description: "अतुल महिंद यांच्या लेखांचा संग्रह. मराठी कविता, भटकंतीचे किस्से, पुस्तकांबद्दल गप्पा आणि जगाकडे पाहताना सुचलेले विचार."
---

<div class="blog">
    <ul>
        {% for post in site.posts %}
        <li>
            <time class="date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y %b %d' }}</time><span class="blog__separator" aria-hidden="true"> - </span><a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
        {% endfor %}
    </ul>
</div>
